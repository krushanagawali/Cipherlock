<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A73E8"/>
      <stop offset="100%" stop-color="#0D47A1"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E8F0FE"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>

  <!-- Subtle circuit lines in background -->
  <path d="M64 128 h96 v64 h64 M384 128 h-64 v96 h-64 M128 384 h96 v-48 h64 M448 384 h-96 v-96 h-64" stroke="#4285F4" stroke-width="4" stroke-opacity="0.4" fill="none" stroke-linecap="round"/>
  <circle cx="160" cy="128" r="6" fill="#8AB4F8"/>
  <circle cx="320" cy="128" r="6" fill="#8AB4F8"/>
  <circle cx="224" cy="384" r="6" fill="#8AB4F8"/>
  <circle cx="352" cy="288" r="6" fill="#8AB4F8"/>

  <!-- Google 4-color micro nodes -->
  <circle cx="196" cy="192" r="8" fill="#4285F4"/>
  <circle cx="316" cy="192" r="8" fill="#EA4335"/>
  <circle cx="196" cy="320" r="8" fill="#FBBC05"/>
  <circle cx="316" cy="320" r="8" fill="#34A853"/>

  <!-- Main Security Shield -->
  <g filter="url(#shadow)">
    <path d="M256 104 C184 104, 152 144, 152 192 C152 288, 208 360, 256 392 C304 360, 360 288, 360 192 C360 144, 328 104, 256 104 Z" fill="url(#shieldGrad)"/>
    <!-- Shield inner outline -->
    <path d="M256 128 C198 128, 172 160, 172 200 C172 276, 218 336, 256 364 C294 336, 340 276, 340 200 C340 160, 314 128, 256 128 Z" fill="none" stroke="#D2E3FC" stroke-width="4"/>
    
    <!-- Lock Mechanism -->
    <rect x="220" y="228" width="72" height="56" rx="12" fill="#1A73E8"/>
    <path d="M236 228 V206 C236 194.95, 244.95 186, 256 186 C267.05 186, 276 194.95, 276 206 V228" fill="none" stroke="#1A73E8" stroke-width="12" stroke-linecap="round"/>
    <circle cx="256" cy="250" r="6" fill="#FFFFFF"/>
    <path d="M256 256 V268" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round"/>
  </g>
</svg>
