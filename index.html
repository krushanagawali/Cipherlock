    <script>
      (function() {
        // 1. Intercept Vite HMR WebSocket connection to prevent connection failure exceptions in sandbox
        if (typeof window !== 'undefined' && window.WebSocket) {
          const RealWebSocket = window.WebSocket;
          function MockViteWebSocket(url, protocols) {
            const isVite = (typeof protocols === 'string' && protocols.startsWith('vite-')) ||
              (Array.isArray(protocols) && protocols.some(p => typeof p === 'string' && p.startsWith('vite-'))) ||
              (typeof url === 'string' && (url.includes('token=') || url.includes('24678') || url.includes('vite')));

            if (!isVite) {
              return new RealWebSocket(url, protocols);
            }

            const target = new EventTarget();
            target.url = String(url || '');
            target.protocol = 'vite-hmr';
            target.readyState = 1; // WebSocket.OPEN
            target.bufferedAmount = 0;
            target.extensions = '';
            target.binaryType = 'blob';
            target.onopen = null;
            target.onclose = null;
            target.onerror = null;
            target.onmessage = null;
            target.send = function() {};
            target.close = function(code, reason) {
              target.readyState = 3;
              const ev = new CloseEvent('close', { code: code || 1000, reason: reason || '' });
              target.dispatchEvent(ev);
              if (typeof target.onclose === 'function') target.onclose(ev);
            };

            setTimeout(function() {
              const ev = new Event('open');
              target.dispatchEvent(ev);
              if (typeof target.onopen === 'function') target.onopen(ev);
            }, 10);

            return target;
          }

          MockViteWebSocket.prototype = RealWebSocket.prototype;
          MockViteWebSocket.CONNECTING = 0;
          MockViteWebSocket.OPEN = 1;
          MockViteWebSocket.CLOSING = 2;
          MockViteWebSocket.CLOSED = 3;
          window.WebSocket = MockViteWebSocket;
        }

        // 2. Prevent unhandled [vite] errors from bubbling to platform listeners
        window.addEventListener('error', function(event) {
          const msg = event?.message || '';
          if (typeof msg === 'string' && msg.includes('[vite]')) {
            event.stopImmediatePropagation();
            event.preventDefault();
          }
        }, true);

        window.addEventListener('unhandledrejection', function(event) {
          const reason = event?.reason;
          const msg = (reason && reason.message) ? reason.message : String(reason || '');
          if (typeof msg === 'string' && msg.includes('[vite]')) {
            event.stopImmediatePropagation();
            event.preventDefault();
          }
        }, true);

        // 3. Filter console output for harmless [vite] notices
        const muteVite = function(origFn) {
          return function(...args) {
            const str = args.map(a => (a instanceof Error ? a.message : String(a || ''))).join(' ');
            if (str.includes('[vite]')) return;
            origFn.apply(console, args);
          };
        };
        console.error = muteVite(console.error);
        console.warn = muteVite(console.warn);
        console.info = muteVite(console.info);
        console.log = muteVite(console.log);
      })();
    </script>
